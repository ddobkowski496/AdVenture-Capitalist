<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Offline Capitalist Secure Launcher</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f14; font-family: sans-serif;
        }
        iframe {
            width: 100%; height: 100%; border: none; display: none;
        }
        #setupScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; text-align: center; background: #0f141c;
        }
        .box {
            background: #171f2a; padding: 30px; border-radius: 12px; border: 2px solid #00ff88; box-shadow: 0 0 20px rgba(0,0,0,0.6); max-width: 400px;
        }
        h2 { color: #00ff88; margin-top: 0; font-size: 22px; }
        p { color: #a0aec0; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .btn {
            background: #00ff88; color: #0b0f14; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 14px;
        }
        .btn:hover { background: #33ff99; }
        
        /* Floating Control Dock */
        #saveDock {
            position: fixed; bottom: 15px; right: 15px; z-index: 999999;
            background: rgba(15, 20, 28, 0.95); padding: 10px; border-radius: 8px;
            border: 1px solid #00ff88; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none;
        }
        #saveDock button {
            background: #171f2a; color: #fff; border: 1px solid #4a5568; padding: 8px 14px;
            cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 4px; margin-left: 5px; transition: 0.2s;
        }
        #saveDock button:hover { background: #2d3748; border-color: #00ff88; }
    </style>
</head>
<body>

    <!-- Setup Prompt -->
    <div id="setupScreen">
        <div class="box">
            <h2>Offline Capitalist Save Engine</h2>
            <p>Select your original game HTML file below. This creates a secure, localized environment so your money values load correctly instead of resetting to $0.00.</p>
            <input type="file" id="gameLoader" accept=".html" style="display: none;">
            <button class="btn" onclick="document.getElementById('gameLoader').click()">🎮 Select & Start Game</button>
        </div>
    </div>

    <!-- The Game Frame Container -->
    <iframe id="gameFrame" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>

    <!-- Floating UI Menu -->
    <div id="saveDock">
        <button id="exportBtn">⬇️ Export Save</button>
        <button id="importBtn">⬆️ Import Save</button>
        <input type="file" id="savePicker" style="display: none;" accept=".json">
    </div>

    <script>
        let gameCodeData = "";

        document.getElementById('gameLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                gameCodeData = evt.target.result;
                
                // Boot the game securely inside the frame using Blob translation
                launchGameInstance();
            };
            reader.readAsText(file);
        });

        function launchGameInstance() {
            if (!gameCodeData) return;

            const frame = document.getElementById('gameFrame');
            
            // Build an isolated Blob URL out of the raw game code text
            const blob = new Blob([gameCodeData], { type: 'text/html' });
            const blobURL = URL.createObjectURL(blob);
            
            // Point the frame to our local virtual memory address
            frame.src = blobURL;
            
            // Hide the setup menu, reveal the game and controls
            document.getElementById('setupScreen').style.display = 'none';
            frame.style.display = 'block';
            document.getElementById('saveDock').style.display = 'block';
        }

        // === EXPORT ENGINE ===
        document.getElementById('exportBtn').addEventListener('click', () => {
            const allData = JSON.stringify(localStorage);
            
            if (allData === '{}' || Object.keys(localStorage).length === 0) {
                alert('No save profile metrics found yet! Buy your first business first.');
                return;
            }

            const blob = new Blob([allData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = 'offline_capitalist_save.json';
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // === IMPORT ENGINE ===
        const savePicker = document.getElementById('savePicker');
        document.getElementById('importBtn').addEventListener('click', () => savePicker.click());

        savePicker.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const backup = JSON.parse(evt.target.result);
                    
                    localStorage.clear();
                    
                    for (const key in backup) {
                        localStorage.setItem(key, backup[key]);
                    }
                    
                    alert('Progress loaded successfully! Re-syncing the game window...');
                    
                    // Reload the game engine instance immediately inside the page frame
                    launchGameInstance();
                } catch (err) {
                    alert('Error: This is not a valid Offline Capitalist JSON save package.');
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
