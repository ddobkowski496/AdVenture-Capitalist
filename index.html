<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adventure Capitalist Launcher</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
        }
        iframe {
            width: 100%; height: 100%; border: none;
        }
        /* Theme matched to Adventure Capitalist green/gold */
        #saveMenu {
            position: fixed; bottom: 15px; right: 15px; z-index: 99999;
            background: rgba(18, 53, 36, 0.95); padding: 10px; border-radius: 8px;
            border: 2px solid #d4af37; box-shadow: 0 0 15px rgba(0,0,0,0.7); font-family: Arial, sans-serif;
        }
        #saveMenu button {
            background: #d4af37; color: #123524; border: none; padding: 8px 14px;
            cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 4px; margin-left: 5px;
            text-transform: uppercase; transition: background 0.2s;
        }
        #saveMenu button:hover { background: #f3cf55; }
    </style>
</head>
<body>

    <!-- CHANGE 'adventure-capitalist.html' IF YOUR FILENAME IS DIFFERENT -->
    <iframe src="adventure-capitalist.html"></iframe>

    <!-- Floating Save Panel -->
    <div id="saveMenu">
        <button id="exportSave">💰 Export Capital</button>
        <button id="importSave">💼 Import Capital</button>
        <input type="file" id="filePicker" style="display: none;" accept=".json">
    </div>

    <script>
        // === EXPORT FEATURE ===
        document.getElementById('exportSave').addEventListener('click', () => {
            const allData = JSON.stringify(localStorage);
            
            if (allData === '{}') {
                alert('No business progress found to export! Buy some lemons first.');
                return;
            }

            const blob = new Blob([allData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = 'adventure_capitalist_save.json';
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // === IMPORT FEATURE ===
        const filePicker = document.getElementById('filePicker');
        
        document.getElementById('importSave').addEventListener('click', () => {
            filePicker.click();
        });

        filePicker.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const backup = JSON.parse(evt.target.result);
                    
                    localStorage.clear();
                    
                    for (const key in backup) {
                        localStorage.setItem(key, backup[key]);
                    }
                    
                    alert('Profits loaded! Restarting businesses...');
                    window.location.reload();
                } catch (err) {
                    alert('Error: This is not a valid Adventure Capitalist save file.');
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
