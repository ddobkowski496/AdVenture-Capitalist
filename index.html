<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Offline Capitalist Save Engine</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff;
            font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #bootPanel {
            background: #1a1f26; padding: 30px; border-radius: 12px; border: 2px solid #00ff88;
            text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.8); max-width: 400px; z-index: 10;
        }
        h2 { color: #00ff88; margin-top: 0; }
        p { color: #8b949e; font-size: 14px; line-height: 1.4; }
        .boot-btn {
            background: #00ff88; color: #121212; border: none; padding: 12px 24px;
            font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer;
            text-transform: uppercase; margin-top: 15px; width: 100%; box-sizing: border-box;
        }
        .boot-btn:hover { background: #33ff99; }
    </style>
</head>
<body>

    <!-- STAGE 1: LOCAL APP BOOTSTRAPPER -->
    <div id="bootPanel">
        <h2>Offline Capitalist Engine</h2>
        <p>Browser security blocks cross-frame file modifications natively. Select your game file once below to boot with active database save injection privileges.</p>
        <input type="file" id="gamePicker" accept=".html" style="display: none;">
        <button class="boot-btn" onclick="document.getElementById('gamePicker').click()">🚀 Launch Game File</button>
    </div>

    <script>
        document.getElementById('gamePicker').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const rawGameCode = evt.target.result;
                
                // Clear setup box from DOM tree structure
                document.getElementById('bootPanel').remove();

                // Inject the entire code directly into the active tab surface execution layer
                document.open();
                document.write(rawGameCode);
                
                // Construct the floating dashboard controls completely outside of a frame container
                const menuMarkup = document.createElement('div');
                menuMarkup.id = 'saveMenu';
                menuMarkup.style = 'position: fixed; bottom: 10px; right: 10px; z-index: 999999; background: rgba(0, 0, 0, 0.9); padding: 8px; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.5); border: 1px solid #00ff88; font-family: sans-serif;';
                menuMarkup.innerHTML = `
                    <button id="exportSave" style="background: #222; color: #fff; border: 1px solid #555; padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 4px;">⬇️ Export Save</button>
                    <button id="importSave" style="background: #222; color: #fff; border: 1px solid #555; padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 4px; margin-left: 5px;">⬆️ Import Save</button>
                    <input type="file" id="filePicker" style="display: none;" accept=".json">
                `;
                document.body.appendChild(menuMarkup);

                // Initialize internal event processing routines
                bindSaveMechanics();
                document.close();
            };
            reader.readAsText(file);
        });

        function bindSaveMechanics() {
            // === EXPORT DATA PIPELINE ===
            document.getElementById('exportSave').addEventListener('click', () => {
                const allData = JSON.stringify(localStorage);
                
                if (allData === '{}' || Object.keys(localStorage).length === 0) {
                    alert('No Offline Capitalist progression metrics found to extract yet!');
                    return;
                }

                const blob = new Blob([allData], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                
                a.href = url;
                a.download = 'offline_capitalist_save.json';
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // === IMPORT DATA PIPELINE ===
            const filePicker = document.getElementById('filePicker');
            document.getElementById('importSave').addEventListener('click', () => filePicker.click());

            filePicker.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const backup = JSON.parse(evt.target.result);
                        
                        // Vaporize localized settings instantly
                        localStorage.clear();
                        
                        // Push numbers safely into the active memory path
                        for (const key in backup) {
                            localStorage.setItem(key, backup[key]);
                }
                        
                        alert('Database synced successfully! Refreshing active game loop vectors...');
                        window.location.reload();
                    } catch (err) {
                        alert('Error: System failed to parse structural backup configuration profile metrics.');
                    }
                };
                reader.readAsText(file);
            });
        }
    </script>
</body>
</html>
