<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adventure Capitalist Offline Launcher</title>
    <style>
        /* Forces the game container to fill the entire screen natively */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
        }
        #gameSurface {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;
        }
        /* Style for the floating transfer panel matching your exact layout */
        #saveMenu {
            position: fixed; bottom: 10px; right: 10px; z-index: 999999;
            background: rgba(18, 53, 36, 0.95); padding: 8px; border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); font-family: sans-serif;
            border: 1px solid #d4af37;
        }
        #saveMenu button {
            background: #d4af37; color: #123524; border: none; padding: 6px 12px;
            cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 4px; margin-left: 5px;
        }
        #saveMenu button:hover { background: #f3cf55; }
    </style>
</head>
<body>

    <!-- Container where the game code will inject directly -->
    <div id="gameSurface"></div>

    <!-- Floating Save/Load Overlay -->
    <div id="saveMenu">
        <button id="exportSave">💰 Export Save</button>
        <button id="importSave">💼 Import Save</button>
        <input type="file" id="filePicker" style="display: none;" accept=".json">
    </div>

    <script>
        // === CORE SERVERLESS MOUNT ENGINE ===
        // Fetches your game file directly using browser text streams to destroy iframe limits
        fetch('adventure-capitalist.html')
            .then(response => {
                if (!response.ok) throw new Error("Could not find adventure-capitalist.html");
                return response.text();
            })
            .then(htmlString => {
                const surface = document.getElementById('gameSurface');
                
                // Inject the raw HTML clone game code straight onto the active page surface
                surface.innerHTML = htmlString;
                
                // Find and execute any scripts embedded within the clone game file
                const scripts = surface.getElementsByTagName('script');
                for (let i = 0; i < scripts.length; i++) {
                    const freshScript = document.createElement('script');
                    if (scripts[i].src) {
                        freshScript.src = scripts[i].src;
                    } else {
                        freshScript.textContent = scripts[i].textContent;
                    }
                    document.body.appendChild(freshScript);
                }
            })
            .catch(err => {
                alert("Error loading target game file. Ensure 'adventure-capitalist.html' is placed in the same exact directory.");
            });

        // === EXPORT FEATURE ===
        document.getElementById('exportSave').addEventListener('click', () => {
            const allData = JSON.stringify(localStorage);
            
            if (allData === '{}' || Object.keys(localStorage).length === 0) {
                alert('No save data found to export! Buy some businesses first.');
                return;
            }

            const blob = new Blob([allData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = 'adventure_capitalist_offline_save.json';
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // === IMPORT FEATURE ===
        const filePicker = document.getElementById('filePicker');
        
        document.getElementById('importSave').addEventListener('click', () => {
            filePicker.click();
        });

        filePicker.addEventListener('change', (e) => {
            const file = e.target.files;
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const backup = JSON.parse(evt.target.result);
                    
                    // Wipe the active memory cleanly
                    localStorage.clear();
                    
                    // Repopulate with the values from your backup json file
                    for (const key in backup) {
                        localStorage.setItem(key, backup[key]);
                    }
                    
                    alert('Save imported successfully! Forcing immediate hardware redirect to commit save metrics...');
                    
                    // Hard re-route the entire screen window back onto itself to lock values in place
                    window.location.replace(window.location.href);
                } catch (err) {
                    alert('Error: This file is not a valid Adventure Capitalist save package.');
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
