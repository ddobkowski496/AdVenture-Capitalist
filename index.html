<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Games Dashboard</title>
    <style>
        :root {
            --bg-color: #0c0f12;
            --card-bg: #161b22;
            --accent-color: #00ff88;
            --accent-gold: #d4af37;
            --text-color: #ffffff;
            --text-muted: #8b949e;
        }

        body, html {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        /* Split layout: Sidebar left, Game View right */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 300px;
            background-color: var(--card-bg);
            border-right: 1px solid #30363d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .sidebar h1 {
            font-size: 1.5rem; margin: 0 0 5px 0; letter-spacing: 0.5px;
        }

        .sidebar p {
            color: var(--text-muted); font-size: 0.85rem; margin: 0 0 25px 0;
        }

        .game-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .menu-item {
            background: #21262d;
            border: 1px solid #30363d;
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .menu-item:hover, .menu-item.active {
            border-color: var(--accent-color);
            background: #28303d;
            transform: translateX(3px);
        }

        /* Heavy Duty Sync Panel Utilities */
        .sync-panel {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            margin-top: auto;
        }

        .sync-panel h3 {
            margin: 0 0 10px 0; font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px;
        }

        .sync-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .sync-btn:hover { opacity: 0.9; }
        #exportBtn { background: var(--accent-color); color: #000; }
        #importBtn { background: #d4af37; color: #000; }

        /* Absolute Game Viewer Frame Screen */
        .game-viewport {
            flex-grow: 1;
            background: #000;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .no-game-prompt {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dashboard Sidebar Navigation & Save Manager Tools -->
        <div class="sidebar">
            <h1>Arcade Panel</h1>
            <p>Unified Offline Save Controller</p>
            
            <div class="game-menu">
                <button class="menu-item" onclick="loadGame('retro-bowl.html', this)">🏈 Retro Bowl</button>
                <button class="menu-item" onclick="loadGame('adventure-capitalist.html', this)">💰 Adventure Capitalist</button>
            </div>

            <div class="sync-panel">
                <h3>Save Management</h3>
                <button id="exportBtn" class="sync-btn" onclick="exportActiveGameSave()">⬇️ Export Progress</button>
                <button id="importBtn" class="sync-btn" onclick="triggerImportSelection()">⬆️ Import Progress</button>
                <input type="file" id="dashboardFilePicker" style="display: none;" accept=".json" onchange="importActiveGameSave(this)">
            </div>
        </div>

        <!-- Dynamic Game Viewer Window Frame -->
        <div class="game-viewport" id="viewport">
            <div class="no-game-prompt" id="prompt">
                <h2>Welcome to Your Arcade</h2>
                <p>Select a game from the sidebar engine to begin playing.</p>
            </div>
            <iframe id="gameFrame" src="" style="display: none;"></iframe>
        </div>
    </div>

    <script>
        let currentActiveGame = "";

        function loadGame(url, buttonElement) {
            // Remove active classes
            document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            // Set up context tracking parameters
            currentActiveGame = url;
            document.getElementById('prompt').style.display = 'none';
            
            const iframe = document.getElementById('gameFrame');
            iframe.style.display = 'block';
            iframe.src = url;
        }

        // === GLOBAL SYNC SAVE EXTRACTION MODULE ===
        function exportActiveGameSave() {
            if (!currentActiveGame) {
                alert("Please load a game from the selection menu before exporting.");
                return;
            }

            const iframe = document.getElementById('gameFrame');
            
            try {
                // Safely grab the absolute storage dictionary snapshot from the running frame
                const frameLocalStorage = iframe.contentWindow.localStorage;
                const saveDataString = JSON.stringify(frameLocalStorage);

                if (saveDataString === '{}' || Object.keys(frameLocalStorage).length === 0) {
                    alert("No save data found yet inside this session timeline. Play a bit first!");
                    return;
                }

                // Generate pure offline file artifact
                const blob = new Blob([saveDataString], { type: 'application/json' });
                const downloadUrl = URL.createObjectURL(blob);
                const downloadAnchor = document.createElement('a');
                
                downloadAnchor.href = downloadUrl;
                downloadAnchor.download = `${currentActiveGame.replace('.html', '')}_unblocked_save.json`;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                
                // Memory scrubbing cleanup
                document.body.removeChild(downloadAnchor);
                URL.revokeObjectURL(downloadUrl);
            } catch (error) {
                alert("Security block triggered. Remember to run your index.html file through a local web server (like VS Code Live Server) so the frame can share memory paths.");
            }
        }

        function triggerImportSelection() {
            if (!currentActiveGame) {
                alert("Load your game choice before attempting to supply a backup profile.");
                return;
            }
            document.getElementById('dashboardFilePicker').click();
        }

        // === ENGINE LOOP BYPASS CONTROLLER ===
        function importActiveGameSave(fileInputElement) {
            const file = fileInputElement.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedPayload = JSON.parse(event.target.result);
                    const iframe = document.getElementById('gameFrame');
                    
                    // 1. Flush the inner framework memory clean to break the active javascript numbers loop
                    iframe.contentWindow.localStorage.clear();
                    
                    // 2. Inject target numbers inside the raw backend layer directly
                    for (const dictionaryKey in importedPayload) {
                        iframe.contentWindow.localStorage.setItem(dictionaryKey, importedPayload[dictionaryKey]);
                    }

                    alert("Data synchronized successfully into application cache layers! Purging runtime state variables...");
                    
                    // 3. HARD RESET: Force structural layout change to replace active execution paths instantly
                    const preservedUrl = iframe.src;
                    iframe.src = 'about:blank'; 
                    setTimeout(() => {
                        iframe.src = preservedUrl; // Re-instantiates layout cleanly with fresh memory metrics
                    }, 50);

                } catch (exception) {
                    alert("Error processing import package configuration. Ensure structural integrity of your save JSON format.");
                }
                fileInputElement.value = ""; // Zero value register target tracking reset
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
